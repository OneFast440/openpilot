# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: ford
  title: Ford / Lincoln Settings
  description: ''
  items:
  - key: FordPrefLateralControl
    widget: multiple_button
    title: Primary Lateral Control
    description: Which signal steers the car. Stock drives curvature alone, as upstream openpilot does. Curvature drives all four of
      the signals the power steering module accepts, blending the model into the planner and anticipating curves. Angle steers with
      path_angle instead, which the module acts on immediately rather than filtering for up to a second.
    options:
    - value: 0
      label: Stock
    - value: 1
      label: Curvature
    - value: 2
      label: Angle
    enablement: &id001
    - $ref: '#/macros/offroad'
  - key: FordLowSpeedFactor_ang
    widget: option
    title: Low Speed Factor (Angle)
    description: Scales the steering response below roughly 30 mph (50 km/h). Above 1.0 turns the wheel more, below 1.0 turns it less.
      Default 1.0.
    min: 0.5
    max: 1.5
    step: 0.05
    visibility: &id002
    - type: param
      key: FordPrefLateralControl
      equals: 2
    enablement: *id001
  - key: FordHighSpeedFactor_ang
    widget: option
    title: High Speed Factor (Angle)
    description: Scales the steering response above roughly 70 mph (115 km/h). Above 1.0 turns the wheel more, below 1.0 turns it less.
      Default 1.0.
    min: 0.5
    max: 1.5
    step: 0.05
    visibility: *id002
    enablement: *id001
  - key: FordHighSpeedDampening_ang
    widget: option
    title: High Speed Dampening (Angle)
    description: Scales the steering response on high-speed straightaways and gentle curves. Reduce it if the car oversteers on the
      highway, increase it if it understeers. Default 1.0.
    min: 0.25
    max: 1.25
    step: 0.05
    visibility: *id002
    enablement: *id001
  - key: FordLaneChangeFactor_ang
    widget: option
    title: Lane Change Factor (Angle)
    description: Scales steering authority during a lane change. Most vehicles never need this; raise it if lane changes feel too soft.
      Default 1.0.
    min: 0.85
    max: 1.5
    step: 0.05
    visibility: *id002
    enablement: *id001
  - key: FordSatObserver_ang
    widget: toggle
    title: Detect Steering Saturation (Angle)
    description: Notices when the power steering module has stopped following a larger command, by comparing how much the truck actually
      turned against how much was asked of it. Without this the car keeps commanding harder into a curve the module is already refusing,
      which is what snaps the wheel back on the way out. It does not make the steering stronger. Off by default; try it on a road with
      real corners and watch for any hesitation mid-curve.
    visibility: *id002
    enablement: *id001
  - key: FordDeliveryCompensation_ang
    widget: toggle
    title: Correct Steering Shortfall (Angle)
    description: Act on that measurement instead of only noticing it. Measured over four logs this platform turns about 0.87 of the
      curvature it is asked for, with nothing anywhere correcting for it, so the car runs wide and you add the rest. This scales the
      steering command by whatever cancels the shortfall it measures. It only ever adds, it is capped, and it fades out whenever you
      touch the wheel. Needs Detect Steering Saturation on.
    visibility: *id002
    enablement: *id001
  - key: FordHumanTurnDetection_curv
    widget: toggle
    title: Hand Back On Manual Turns
    description: Hand steering back to you while you hold a real turn, instead of winding up a command the power steering module has
      to reconcile when you let go. Control resumes on its own. Turning this off keeps openpilot steering through your input, which
      follows the plan more closely but leaves the module a larger difference to reconcile when you release the wheel. Applies to
      both Angle and Curvature.
    visibility:
    - type: any
      conditions:
      - type: param
        key: FordPrefLateralControl
        equals: 1
      - type: param
        key: FordPrefLateralControl
        equals: 2
    enablement: *id001
  - key: FordLaneChangeFactor_curv
    widget: option
    title: Lane Change Factor (Curvature)
    description: Scales steering authority during a lane change. Lower is gentler. Default 0.85.
    min: 0.5
    max: 1.0
    step: 0.05
    visibility: &id003
    - &id004
      type: param
      key: FordPrefLateralControl
      equals: 1
    enablement: *id001
  - key: FordLanePositioning_curv
    widget: toggle
    title: Lane Centering Trim (Curvature)
    description: Trim the car toward the center of the lane with a separate heading correction, rather than relying on curvature alone.
      Off by default.
    visibility: *id003
    enablement: *id001
  - key: FordLaneFullMode_curv
    widget: toggle
    title: Use Detected Lane Lines (Curvature)
    description: Blend the detected lane lines into the lane position rather than following the model path alone. Helps where the lane
      is well marked and the model path is not centered.
    visibility: *id003
    enablement: *id001
  - key: FordPathOffset_curv
    widget: option
    title: In-Lane Position (Curvature)
    description: Shift the car within its lane. Negative moves left, positive moves right. Default 0.0.
    min: -1.0
    max: 1.0
    step: 0.05
    visibility: *id003
    enablement: *id001
  - key: FordCustomProfile_curv
    widget: toggle
    title: Custom Tuning Profile (Curvature)
    description: Tune how much of the model prediction is blended into the planner, and how hard the car works to hold lane position.
      Leave this off to use the values tested for your vehicle.
    visibility: *id003
    enablement: *id001
  - key: FordBlendRatioLow_curv
    widget: option
    title: Model Blend, Straights (Curvature)
    description: How much of the model prediction is used on straights and gentle curves. 0.0 is planner only, 1.0 is model only. Default
      0.4.
    min: 0.0
    max: 1.0
    step: 0.05
    visibility:
    - *id004
    - &id005
      type: param
      key: FordCustomProfile_curv
      equals: true
    enablement: *id001
  - key: FordBlendRatioHigh_curv
    widget: option
    title: Model Blend, Curves (Curvature)
    description: How much of the model prediction is used in sharper curves. 0.0 is planner only, 1.0 is model only. Default 0.4.
    min: 0.0
    max: 1.0
    step: 0.05
    visibility:
    - *id004
    - *id005
    enablement: *id001
  - key: FordLanePositioningGain_curv
    widget: option
    title: Lane Centering Strength (Curvature)
    description: How hard the centering correction works. Raise it if the car sits off center, lower it if it wanders. Default 3.0.
    min: 0.0
    max: 20.0
    step: 0.5
    visibility:
    - *id004
    - *id005
    - type: param
      key: FordLanePositioning_curv
      equals: true
    enablement: *id001
  - key: FordFollowControl
    widget: toggle
    title: Lead-Aware Following
    description: 'Adjust gas and braking based on what the lead vehicle is doing: cut gas when closing on it, cap gas when matched to
      it, and ease the first brake application in. Highway speeds only, and only behind a lead that is also moving at highway speed.'
    enablement: *id001
  - key: FordDownhillCompensation
    widget: toggle
    title: Downhill Brake Compensation
    description: Let a downhill grade count toward the braking decision. Turn this off if the car pre-charges the brakes every time
      the road tips forward.
    enablement: *id001
  - key: ThrottleOverrideHold
    widget: toggle
    title: Hold Throttle Through Pedal Override
    description: Keep commanding throttle while you are on the accelerator pedal, instead of handing longitudinal control back for
      the whole press. The car decides between your pedal and sunnypilot's request, so lifting off hands back to whatever sunnypilot
      was already asking for rather than starting from nothing. The brakes are never applied while you are on the pedal. Has no
      effect with "Disengage Cruise on Accelerator Pedal" enabled.
    enablement: *id001
  - key: FordLateralAccelLimit
    widget: option_control
    title: Cornering Limit
    description: The hardest cornering sunnypilot will ask for, in m/s^2. This is what decides the tightest curve it can command
      at a given speed, and it falls with the square of speed. The default allows a 6.7 m radius at 10 mph but only 42 m at 25
      mph, which is why a tight turn needs the speed brought down to it. The default is the ISO comfort figure. Raising it makes
      the vehicle corner harder everywhere, not only in tight turns.
    default: 3.0
    min: 3.0
    max: 5.0
    step: 0.1
    enablement: *id001
  - key: FordLateralJerkLimit
    widget: option_control
    title: Turn-In Rate Limit
    description: How quickly sunnypilot may wind into a curve, in m/s^3. Also falls with the square of speed. The default is the
      ISO comfort figure. Above roughly 45 mph the angle-mode rate limit binds first, so raising this only has an effect below
      that.
    default: 5.0
    min: 5.0
    max: 12.0
    step: 0.5
    enablement: *id001
  - key: FordPedalOverrideThreshold
    widget: option_control
    title: Pedal Override Threshold
    description: How far the accelerator has to move before sunnypilot treats it as yours. The vehicle reports any pedal
      movement at all as a press, so without this the lightest touch hands longitudinal control back and the truck slows
      under a pedal you have just rested on. A deliberate press measures well above the default. Raising it keeps sunnypilot
      commanding through a light press, which has not been proven safe on this platform; raise it a little at a time and
      watch for a cruise fault.
    default: 2.0
    min: 0.0
    max: 25.0
    step: 0.5
    enablement: *id001
  - key: FordHandsFreeClusterMsg
    widget: toggle
    title: Hands-Free Cluster Display
    description: Use the cluster's BlueCruise hands-free presentation while lateral control is active. CAN FD vehicles only.
    visibility:
    - type: capability
      field: brand
      equals: ford
    enablement: *id001
  - key: FordBrakeLightStatus
    widget: toggle
    title: Brake Light Indicator
    description: Turn the on-road steering wheel icon red while the vehicle's brake lights are lit, whether they were lit by you, by
      openpilot or by the stock cruise control. Read from the vehicle rather than guessed. On this platform the only working source
      reports about once a second, so treat it as a rough indication rather than an instant one.
    enablement: *id001
  - key: FordDriverMonitorCanMsg
    widget: toggle
    title: Driver Monitoring In Cluster
    description: Drive the cluster's own hands-on-wheel prompt and warnings from driver monitoring, so the escalation appears in the
      instrument cluster as well as on the device.
    enablement: *id001
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
