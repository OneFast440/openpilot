# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: ford
  title: Ford / Lincoln Settings
  description: ''
  items:
  - key: FordPrefLateralControl
    widget: multiple_button
    title: Primary Lateral Control
    description: Which signal steers the car. Curvature is the stock strategy. Angle steers with path_angle instead, which
      the power steering module acts on immediately rather than filtering for up to a second, and generally holds a lane and
      exits curves more cleanly. Switch back to Curvature if your vehicle does not respond well.
    options:
    - value: 0
      label: Curvature
    - value: 1
      label: Angle
    enablement:
    - $ref: '#/macros/offroad'
  - key: FordLowSpeedFactor_ang
    widget: option
    title: Low Speed Factor (Angle)
    description: Scales the steering response below roughly 30 mph (50 km/h). Above 1.0 turns the wheel more, below 1.0 turns
      it less. Default 1.0.
    min: 0.5
    max: 1.5
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
    enablement:
    - $ref: '#/macros/offroad'
  - key: FordHighSpeedFactor_ang
    widget: option
    title: High Speed Factor (Angle)
    description: Scales the steering response above roughly 70 mph (115 km/h). Above 1.0 turns the wheel more, below 1.0 turns
      it less. Default 1.0.
    min: 0.5
    max: 1.5
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
    enablement:
    - $ref: '#/macros/offroad'
  - key: FordHighSpeedDampening_ang
    widget: option
    title: High Speed Dampening (Angle)
    description: Scales the steering response on high-speed straightaways and gentle curves. Reduce it if the car oversteers
      on the highway, increase it if it understeers. Default 1.0.
    min: 0.25
    max: 1.25
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
    enablement:
    - $ref: '#/macros/offroad'
  - key: FordLaneChangeFactor_ang
    widget: option
    title: Lane Change Factor (Angle)
    description: Scales steering authority during a lane change. Most vehicles never need this; raise it if lane changes feel
      too soft. Default 1.0.
    min: 0.85
    max: 1.5
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
    enablement:
    - $ref: '#/macros/offroad'
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
