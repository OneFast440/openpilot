name: Build Panda Firmware

# Trigger manually, or automatically when ford.h or related files change
on:
  workflow_dispatch:
  push:
    branches: [dev, claude/brave-napier]
    paths:
      - 'opendbc_repo/opendbc/safety/modes/ford.h'
      - 'opendbc_repo/opendbc/car/ford/**'
      - 'panda/board/**'
      - '.github/workflows/build_panda.yml'

jobs:
  build-panda-firmware:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Install ARM cross-compiler, scons, and Python crypto for firmware signing
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            scons \
            python3-pip
          pip3 install pycryptodome

      # Install our custom opendbc package so opendbc.INCLUDE_PATH points to
      # opendbc_repo/, which contains our updated ford.h with c0/c1 safety support.
      # The SConscript uses opendbc.INCLUDE_PATH as a C compiler include path.
      - name: Install custom opendbc package
        run: |
          # Regular install (not editable) — copies headers into site-packages.
          # INCLUDE_PATH resolves to site-packages/ where our updated ford.h lives.
          pip3 install opendbc_repo/
          python3 -c "import opendbc; print('opendbc.INCLUDE_PATH:', opendbc.INCLUDE_PATH)"
          test -f "$(python3 -c 'import opendbc; print(opendbc.INCLUDE_PATH)')/opendbc/safety/modes/ford.h" \
            && echo "ford.h found via opendbc.INCLUDE_PATH" || exit 1

      # commaai/panda's SConstruct and SConscript live at the repo root, not board/.
      # Fetch both so we can build from panda/ as if it were the panda repo root.
      - name: Fetch SConstruct and SConscript from commaai/panda
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/commaai/panda/master/SConstruct" \
            -o panda/SConstruct
          curl -fsSL \
            "https://raw.githubusercontent.com/commaai/panda/master/SConscript" \
            -o panda/SConscript

      # Build from panda/ (treated as panda repo root).
      # No RELEASE env var → DEBUG build, signed with board/certs/debug key.
      # The resulting panda_h7.bin.signed is signed with the debug RSA key,
      # which the bootstub accepts on DEV-unknown-DEBUG builds.
      - name: Build panda firmware
        run: |
          cd panda
          scons -u
          echo "=== Build output ==="
          ls -la board/obj/

      # Verify the signed binary was produced
      - name: Verify build output
        run: |
          ls -la panda/board/obj/panda_h7.bin.signed
          ls -la panda/board/obj/bootstub.panda_h7.bin

      # Commit and push the updated binaries back to the branch
      - name: Commit updated firmware binary
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions [panda build]"
          git add panda/board/obj/panda_h7.bin.signed
          git add panda/board/obj/bootstub.panda_h7.bin
          git add panda/board/obj/gitversion.h 2>/dev/null || true
          # Only commit if something changed
          git diff --staged --quiet && echo "Firmware unchanged" && exit 0
          git commit -m "ci: rebuild panda firmware with ford.h c0/c1 safety support"
          git push
